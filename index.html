<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MADHESH M</title>
<style>
:root{--red:#c8102e;--gold:#f5b700;--cyan:#4de8ff;--bg:#07070c;--panel:#12121b;--text:#e9e9f0;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1b0a10,var(--bg) 70%);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.hidden{display:none!important}
/* reactor */
.reactor{width:min(68vw,300px);border-radius:50%;box-shadow:0 0 45px 8px rgba(77,232,255,.45);cursor:pointer;will-change:transform}
.r1{transform-origin:100px 100px;animation:spin 12s linear infinite}
.r2{transform-origin:100px 100px;animation:spin 8s linear infinite reverse}
.core{transform-origin:100px 100px;animation:pulse 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.5;transform:scale(.88)}}
.tap{margin-top:26px;color:var(--cyan);letter-spacing:5px;font-size:.85rem;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
#intro.boom .reactor{animation:boom 1.4s ease-in forwards}
@keyframes boom{40%{transform:scale(1.15)}100%{transform:scale(4);opacity:0}}
#intro.boom .r1,#intro.boom .r2,#intro.boom .core{animation:none}
.wave{position:absolute;width:min(68vw,300px);height:min(68vw,300px);border:2px solid var(--cyan);border-radius:50%;opacity:0;will-change:transform}
#intro.boom .wave{animation:wave 1.3s ease-out forwards}
#intro.boom .wave:nth-of-type(2){animation-delay:.25s}
@keyframes wave{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
/* login */
#login{animation:loginIn .8s ease-out}
@keyframes loginIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.card{position:relative;width:min(92vw,380px);background:rgba(18,18,27,.9);border:1px solid #2a2a3a;padding:34px 26px;display:grid;gap:14px;overflow:hidden}
.card::before,.card::after{content:"";position:absolute;width:26px;height:26px;border:3px solid var(--gold)}
.card::before{top:0;left:0;border-right:0;border-bottom:0}.card::after{bottom:0;right:0;border-left:0;border-top:0}
.card i{position:absolute;left:0;right:0;height:2px;background:var(--cyan);opacity:.5;box-shadow:0 0 12px var(--cyan);animation:scan 3s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(400px)}}
h2{color:var(--gold);letter-spacing:4px;text-align:center;font-size:1.1rem}
input{background:#0b0b12;border:1px solid #2a2a3a;color:var(--text);padding:13px;font:inherit;width:100%}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 10px rgba(77,232,255,.4)}
.btn{padding:13px;border:2px solid var(--gold);background:none;color:var(--gold);letter-spacing:3px;cursor:pointer;font:inherit;transition:.3s}
.btn:hover{background:var(--gold);color:#000;box-shadow:0 0 24px var(--gold)}
#err{color:#ff5470;text-align:center;font-size:.85rem;min-height:1.2em}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* gate */
#gate{position:fixed;inset:0;z-index:50;pointer-events:none}
#gate .h{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(#0d0d16,#1a0a10);transition:transform .8s cubic-bezier(.7,0,.3,1)}
#gate .l{left:0;transform:translateX(-101%);border-right:3px solid var(--gold)}
#gate .r{right:0;transform:translateX(101%);border-left:3px solid var(--gold)}
#gate.close{pointer-events:all}
#gate.close .h{transform:none}
#gt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;transition:.4s;color:var(--cyan);letter-spacing:6px;text-align:center}
#gate.txt #gt{opacity:1}
#gt b{font-size:clamp(1.3rem,6vw,2.2rem);color:var(--gold);animation:blink .5s 3}
.pb{width:min(70vw,300px);height:6px;background:#222}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold))}
#gate.txt .pb i{width:100%;transition:width 1.4s}
/* site */
#site{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
nav{display:flex;justify-content:space-between;align-items:center;padding:12px 3vw;background:rgba(7,7,12,.9);border-bottom:1px solid #2a2a3a;flex-wrap:nowrap;gap:clamp(6px,2vw,14px)}
nav b{color:var(--gold);letter-spacing:clamp(1px,.6vw,3px);font-size:clamp(.72rem,3.4vw,1rem);white-space:nowrap}
#nv{display:flex;flex:1;min-width:0;justify-content:flex-end;gap:clamp(7px,2.2vw,16px);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#nv::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--text);cursor:pointer;margin:0;padding:2px 0;font:inherit;font-size:clamp(.68rem,3.1vw,.9rem)}
nav button:hover,nav button.on{color:var(--gold)}
#view{flex:1;overflow:auto;position:relative}
.panel{display:none;min-height:100%;padding:50px 6vw 120px;max-width:900px;margin:auto}
.panel.active{display:block}
h3{font-size:1.7rem;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:22px}
h3::after{content:"";display:block;width:70px;height:3px;background:var(--red);margin-top:8px}
.box{background:var(--panel);border-left:4px solid var(--red);padding:22px;margin-bottom:14px}
#scan{position:absolute;left:0;right:0;top:-6px;height:6px;background:var(--cyan);box-shadow:0 0 30px 10px var(--cyan);opacity:0;pointer-events:none;z-index:5}
#scan.go{animation:sweep .7s ease-in}
@keyframes sweep{0%{top:-6px;opacity:1}100%{top:100%;opacity:0}}
/* home */
#p-home{text-align:center;padding-top:6vh}
#p-home .mini{width:170px;border-radius:50%;box-shadow:0 0 35px 6px rgba(77,232,255,.4)}
#p-home.active .mini{animation:zin 1.2s cubic-bezier(.2,1.4,.4,1)}
@keyframes zin{from{transform:scale(0) rotate(-360deg)}}
#p-home h1{font-size:clamp(1.8rem,7vw,3.4rem);background:linear-gradient(90deg,var(--red),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin:14px 0}
#p-home.active h1{animation:ls 1.4s ease-out}
@keyframes ls{from{letter-spacing:30px;opacity:0}}
.sub{color:var(--cyan);font-family:monospace}
/* about */
#p-about.active .box{animation:flip 1s ease-out backwards;transform-origin:left}
#p-about.active .box:nth-child(3){animation-delay:.25s}
#p-about.active .box:nth-child(4){animation-delay:.5s}
@keyframes flip{from{transform:perspective(800px) rotateY(-90deg);opacity:0}}
/* education */
#p-education.active .box{animation:fromL .8s ease-out backwards}
#p-education.active .box:nth-child(3){animation-delay:.25s}
@keyframes fromL{from{transform:translateX(-80px);opacity:0}}
/* skills */
.sk{margin-bottom:18px}.sk span{display:flex;justify-content:space-between}
.bar{height:10px;background:#222;border-radius:5px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width 1.6s ease-out .4s}
#p-skills.active .bar i{width:var(--w)}
#p-skills.active .sk{animation:fromR .7s ease-out backwards}
#p-skills.active .sk:nth-child(3){animation-delay:.15s}#p-skills.active .sk:nth-child(4){animation-delay:.3s}#p-skills.active .sk:nth-child(5){animation-delay:.45s}
@keyframes fromR{from{transform:translateX(80px);opacity:0}}
/* contact */
#p-contact.active .box{animation:glitch .9s steps(2) backwards}
#p-contact.active .box:nth-child(3){animation-delay:.2s}#p-contact.active .box:nth-child(4){animation-delay:.4s}
@keyframes glitch{0%{opacity:0;transform:translateX(-30px) skewX(30deg)}30%{opacity:1;transform:translateX(20px) skewX(-20deg);color:var(--cyan)}60%{opacity:.3;transform:translateX(-8px)}}
/* jarvis (voice only) */
#orb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:2px solid var(--cyan);background:radial-gradient(#e6fbff 0 18%,#0a2a33 60%);box-shadow:0 0 22px var(--cyan);cursor:pointer;z-index:20;animation:pulse 2s infinite}
#orb.sb{box-shadow:0 0 14px var(--cyan)}
#orb.ls{border-color:var(--red);box-shadow:0 0 28px var(--red),0 0 55px var(--red)}
#jp{position:fixed;right:12px;bottom:calc(90px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:8px;background:rgba(10,12,20,.92);border:1px solid var(--cyan);color:var(--cyan);padding:6px 10px;font-size:.8rem;z-index:20;max-width:92vw}
#jp.on{display:flex}
#jp button{background:none;border:1px solid var(--cyan);color:var(--cyan);padding:2px 8px;cursor:pointer;font:inherit}
</style>
</head>

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function unlock(u,p){
  var nz=function(s){return s.replace(/\s+/g,"")};
  var secret=nz(u).toLowerCase()+"|"+nz(p);
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(secret),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:250000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));
  return JSON.parse(new TextDecoder().decode(pt));
}

$("rx").onclick=function(){
  $("intro").classList.add("boom");
  wait(function(){$("intro").classList.add("hidden");$("login").classList.remove("hidden");$("u").focus()},1300);
};
// 2. Login (the password unlocks the encrypted website) + lockout after 3 wrong tries
var MAXTRY=3,mem={},lt=null;
function sget(k){var v=null;try{v=localStorage.getItem(k)}catch(e){}return +(v||mem[k]||0)}
function sset(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
function lockLeft(){return Math.max(0,sget("mm_lock")-Date.now())}
function showLock(){
  var ms=lockLeft(),f=$("u");
  if(ms<=0){clearInterval(lt);lt=null;$("u").disabled=false;$("p").disabled=false;$("lb").disabled=false;$("err").textContent="";return}
  var s=Math.ceil(ms/1000),m=Math.floor(s/60);s=s-m*60;
  $("u").disabled=true;$("p").disabled=true;$("lb").disabled=true;
  $("err").textContent="ACCESS LOCKED · Try again in "+m+":"+(s<10?"0":"")+s;
}
function startLock(){if(!lt)lt=setInterval(showLock,1000);showLock()}
function failed(){
  var n=sget("mm_tries")+1;
  if(n>=MAXTRY){
    var c=sget("mm_locks"),mins=Math.min(15*Math.pow(2,c),1440);
    sset("mm_locks",c+1);sset("mm_tries",0);sset("mm_lock",Date.now()+mins*60000);
    startLock();
  }else{
    sset("mm_tries",n);
    $("err").textContent="ACCESS DENIED · Wrong username or password ("+n+"/"+MAXTRY+")";
  }
  var c2=$("login").querySelector(".card");c2.classList.remove("shake");void $("login").offsetWidth;c2.classList.add("shake");
}
var working=false;
function login(){
  if(working)return;
  if(lockLeft()>0){startLock();return}
  if(!(window.crypto&&crypto.subtle)){$("err").textContent="Open this on your https website link, not as a local file.";return}
  working=true;$("err").textContent="VERIFYING…";
  unlock($("u").value,$("p").value).then(function(d){
    sset("mm_tries",0);sset("mm_locks",0);
    $("err").textContent="";
    document.body.insertAdjacentHTML("beforeend",d.html);
    var sc=document.createElement("script");sc.textContent=d.js;document.body.appendChild(sc);
    var g=$("gate");g.classList.add("close");
    wait(function(){g.classList.add("txt")},800);
    wait(function(){
      $("login").classList.add("hidden");$("site").classList.remove("hidden");$("orb").classList.remove("hidden");
      go("home",true);g.classList.remove("txt");g.classList.remove("close");
    },2500);
  }).catch(function(){working=false;failed()});
}
if(lockLeft()>0)startLock();
$("lb").onclick=login;
$("p").onkeydown=function(e){if(e.key==="Enter")login()};
